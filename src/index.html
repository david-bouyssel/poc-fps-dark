<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1 data-i18n="app.title"></h1>
        <p class="subtitle" data-i18n="app.subtitle"></p>
      </header>

      <form id="maze-form" class="controls" novalidate>
        <div class="field">
          <label for="maze-width" data-i18n="form.width"></label>
          <input id="maze-width" name="width" type="number" step="1" value="16" required>
        </div>
        <div class="field">
          <label for="maze-height" data-i18n="form.height"></label>
          <input id="maze-height" name="height" type="number" step="1" value="16" required>
        </div>
        <div class="field field-seed">
          <label for="maze-seed" data-i18n="form.seed"></label>
          <input id="maze-seed" name="seed" type="number" step="1">
        </div>
        <div class="field field-difficulty">
          <label for="maze-difficulty" data-i18n="form.difficulty"></label>
          <select id="maze-difficulty" name="difficulty">
            <option value="easy" data-i18n="difficulty.easy"></option>
            <option value="normal" data-i18n="difficulty.normal" selected></option>
            <option value="nightmare" data-i18n="difficulty.nightmare"></option>
          </select>
        </div>
        <div class="buttons">
          <button id="generate-button" type="submit" class="button button-primary" data-i18n="form.generate"></button>
          <button id="new-maze-button" type="button" class="button button-secondary" data-i18n="form.newMaze"></button>
        </div>
      </form>

      <p id="maze-info" class="info" aria-live="polite"></p>
      <p id="maze-error" class="error" role="alert"></p>

      <div class="view-controls">
        <button id="fps-enter-button" type="button" class="button button-primary" data-i18n="fps.enter"></button>
        <button id="fps-exit-button" type="button" class="button button-secondary" data-i18n="fps.exit" hidden></button>
        <button id="sound-toggle-button" type="button" class="button button-secondary" aria-pressed="false" data-i18n="sound.mute" hidden></button>
      </div>
      <p id="fps-help" class="help" data-i18n="fps.help" hidden></p>
      <p id="fps-help-touch" class="help" data-i18n="fps.helpTouch" hidden></p>
      <p id="fps-goal" class="help" data-i18n="fps.goal" hidden></p>

      <div id="play-area" class="play-area">
      <div id="touch-pad-move" class="touch-pad touch-pad-move" role="group" data-i18n-aria-label="touch.moveGroup" hidden>
        <button type="button" class="touch-button" data-action="forward" data-i18n="touch.forward" data-i18n-aria-label="touch.forwardLabel"></button>
        <button type="button" class="touch-button" data-action="backward" data-i18n="touch.backward" data-i18n-aria-label="touch.backwardLabel"></button>
        <button type="button" class="touch-button" data-action="turnLeft" data-i18n="touch.turnLeft" data-i18n-aria-label="touch.turnLeftLabel"></button>
        <button type="button" class="touch-button" data-action="turnRight" data-i18n="touch.turnRight" data-i18n-aria-label="touch.turnRightLabel"></button>
      </div>
      <div id="maze-stage" class="stage">
        <canvas id="maze-canvas" role="img" data-i18n-aria-label="canvas.label"></canvas>
        <div id="end-screen" class="end-screen" role="alertdialog" aria-labelledby="end-title" aria-describedby="end-message" hidden>
          <h2 id="end-title" class="end-title"></h2>
          <p id="end-message" class="end-message"></p>
          <ul id="end-stats" class="end-stats">
            <li id="end-stat-time"></li>
            <li id="end-stat-explored"></li>
            <li id="end-stat-distance"></li>
          </ul>
          <div class="buttons end-buttons">
            <button id="replay-button" type="button" class="button button-primary" data-i18n="end.replay"></button>
            <button id="end-new-maze-button" type="button" class="button button-secondary" data-i18n="end.newMaze"></button>
          </div>
        </div>
        <div id="pause-screen" class="pause-screen" role="dialog" aria-modal="false" aria-labelledby="pause-title" aria-describedby="pause-message" hidden>
          <h2 id="pause-title" class="end-title" data-i18n="pause.title"></h2>
          <p id="pause-message" class="end-message"></p>
          <div class="buttons end-buttons">
            <button id="resume-button" type="button" class="button button-primary" data-i18n="pause.resume"></button>
          </div>
        </div>
        <p id="round-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      </div>
      <div id="touch-pad-actions" class="touch-pad touch-pad-actions" role="group" data-i18n-aria-label="touch.actionGroup" hidden>
        <button type="button" class="touch-button" data-action="strafeLeft" data-i18n="touch.strafeLeft" data-i18n-aria-label="touch.strafeLeftLabel"></button>
        <button type="button" class="touch-button" data-action="strafeRight" data-i18n="touch.strafeRight" data-i18n-aria-label="touch.strafeRightLabel"></button>
        <button type="button" class="touch-button" data-action="run" data-i18n="touch.run" data-i18n-aria-label="touch.runLabel"></button>
        <button type="button" class="touch-button" data-action="toggleMap" data-i18n="touch.map" data-i18n-aria-label="touch.mapLabel"></button>
        <button type="button" class="touch-button" data-action="pause" data-i18n="touch.pause" data-i18n-aria-label="touch.pauseLabel"></button>
      </div>
      </div>
    </main>
  </body>
</html>
