<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1 data-i18n="app.title"></h1>
        <p class="subtitle" data-i18n="app.subtitle"></p>
      </header>

      <form id="maze-form" class="controls" novalidate>
        <div class="field">
          <label for="maze-width" data-i18n="form.width"></label>
          <input id="maze-width" name="width" type="number" min="2" max="64" step="1" value="16" required>
        </div>
        <div class="field">
          <label for="maze-height" data-i18n="form.height"></label>
          <input id="maze-height" name="height" type="number" min="2" max="64" step="1" value="16" required>
        </div>
        <div class="field field-seed">
          <label for="maze-seed" data-i18n="form.seed"></label>
          <input id="maze-seed" name="seed" type="number" min="0" max="4294967295" step="1">
        </div>
        <div class="buttons">
          <button id="generate-button" type="submit" class="button button-primary" data-i18n="form.generate"></button>
          <button id="new-maze-button" type="button" class="button button-secondary" data-i18n="form.newMaze"></button>
        </div>
      </form>

      <p id="maze-info" class="info" aria-live="polite"></p>
      <p id="maze-error" class="error" role="alert"></p>

      <div class="view-controls">
        <button id="fps-enter-button" type="button" class="button button-primary" data-i18n="fps.enter"></button>
        <button id="fps-exit-button" type="button" class="button button-secondary" data-i18n="fps.exit" hidden></button>
      </div>
      <p id="fps-help" class="help" data-i18n="fps.help" hidden></p>
      <p id="fps-goal" class="help" data-i18n="fps.goal" hidden></p>

      <div id="maze-stage" class="stage">
        <canvas id="maze-canvas" role="img" data-i18n-aria-label="canvas.label"></canvas>
        <div id="end-screen" class="end-screen" role="alertdialog" aria-labelledby="end-title" aria-describedby="end-message" hidden>
          <h2 id="end-title" class="end-title"></h2>
          <p id="end-message" class="end-message"></p>
          <div class="buttons end-buttons">
            <button id="replay-button" type="button" class="button button-primary" data-i18n="end.replay"></button>
            <button id="end-new-maze-button" type="button" class="button button-secondary" data-i18n="end.newMaze"></button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
